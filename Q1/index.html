<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Policy Compliance Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                        'space-dark': '#0F0F23',
                        'space-medium': '#1A1A3E',
                        'space-light': '#25254B'
                    }
                }
            },
            darkMode: 'class'
        }
    </script>
    <style>
        .star-field {
            background: radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                       radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.5), transparent),
                       radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                       radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.5), transparent),
                       radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: sparkle 3s linear infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .password-input {
            transition: all 0.3s ease;
        }
        
        .password-input:focus {
            box-shadow: 0 0 0 3px rgba(93, 92, 222, 0.1);
        }
        
        .result-card {
            transition: all 0.3s ease;
            transform: translateY(10px);
            opacity: 0;
        }
        
        .result-card.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .check-mark {
            animation: checkmark 0.6s ease-in-out;
        }
        
        @keyframes checkmark {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-space-dark via-space-medium to-space-light text-white">
    <!-- Star field background -->
    <div class="star-field fixed inset-0 opacity-20"></div>
    
    <div class="relative z-10 min-h-screen">
        <!-- Header -->
        <header class="text-center py-12 px-4">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    Secure Password Policy Compliance Checker
                </h1>
                <p class="text-xl text-gray-300 mb-8">
                    Enterprise-grade password validation for maximum security
                </p>
                
                <!-- Policy Requirements -->
                <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-6 mb-8 border border-white/20">
                    <h2 class="text-2xl font-semibold mb-4 text-blue-300">Password Policy Requirements</h2>
                    <div class="grid md:grid-cols-3 gap-4 text-left">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center">
                                <span class="text-sm">📏</span>
                            </div>
                            <span>Minimum 12 characters</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span>Upper, lower, digit, symbol</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span>No char repeated >2 times</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 pb-12">
            <!-- Input Section -->
            <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-8 mb-8 border border-white/20">
                <h3 class="text-2xl font-semibold mb-6 text-center">Test Your Passwords</h3>
                
                <!-- Single Password Input -->
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">Single Password Test</label>
                    <div class="flex gap-3">
                        <input 
                            type="text" 
                            id="singlePassword" 
                            placeholder="Enter a password to test..." 
                            class="flex-1 px-4 py-3 bg-white/20 border border-white/30 rounded-lg password-input text-white placeholder-gray-300 text-base focus:outline-none focus:border-primary"
                        >
                        <button 
                            onclick="checkSinglePassword()" 
                            class="px-6 py-3 bg-primary hover:bg-primary/80 rounded-lg font-medium transition-colors"
                        >
                            Check
                        </button>
                    </div>
                </div>

                <!-- Batch Password Input -->
                <div>
                    <label class="block text-sm font-medium mb-2">Batch Password Test (JSON Array)</label>
                    <div class="mb-3">
                        <textarea 
                            id="batchPasswords" 
                            placeholder='["password1", "password2", "password3"]' 
                            rows="4" 
                            class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg password-input text-white placeholder-gray-300 text-base focus:outline-none focus:border-primary resize-none"
                        ></textarea>
                    </div>
                    <div class="flex gap-3">
                        <button 
                            onclick="loadExample()" 
                            class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg text-sm transition-colors"
                        >
                            Load Example
                        </button>
                        <button 
                            onclick="checkBatchPasswords()" 
                            class="px-6 py-2 bg-primary hover:bg-primary/80 rounded-lg font-medium transition-colors"
                        >
                            Check All
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="hidden">
                <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-8 border border-white/20">
                    <h3 class="text-2xl font-semibold mb-6 text-center">Compliance Results</h3>
                    <div id="resultsContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // Password policy compliance checker function
        function checkPasswordCompliance(password) {
            const results = {
                isCompliant: false,
                checks: {
                    length: false,
                    uppercase: false,
                    lowercase: false,
                    digit: false,
                    symbol: false,
                    noRepeatedChars: false
                },
                details: []
            };

            // Check minimum length (12 characters)
            results.checks.length = password.length >= 12;
            results.details.push({
                rule: 'Minimum 12 characters',
                passed: results.checks.length,
                message: `Length: ${password.length} characters`
            });

            // Check for uppercase letter
            results.checks.uppercase = /[A-Z]/.test(password);
            results.details.push({
                rule: 'At least one uppercase letter',
                passed: results.checks.uppercase,
                message: results.checks.uppercase ? 'Contains uppercase' : 'Missing uppercase letter'
            });

            // Check for lowercase letter
            results.checks.lowercase = /[a-z]/.test(password);
            results.details.push({
                rule: 'At least one lowercase letter',
                passed: results.checks.lowercase,
                message: results.checks.lowercase ? 'Contains lowercase' : 'Missing lowercase letter'
            });

            // Check for digit
            results.checks.digit = /[0-9]/.test(password);
            results.details.push({
                rule: 'At least one digit',
                passed: results.checks.digit,
                message: results.checks.digit ? 'Contains digit' : 'Missing digit'
            });

            // Check for symbol
            results.checks.symbol = /[^A-Za-z0-9]/.test(password);
            results.details.push({
                rule: 'At least one symbol',
                passed: results.checks.symbol,
                message: results.checks.symbol ? 'Contains symbol' : 'Missing symbol'
            });

            // Check for no repeated characters more than 2 times
            const charCount = {};
            for (let char of password) {
                charCount[char] = (charCount[char] || 0) + 1;
            }
            const maxRepeated = Math.max(...Object.values(charCount));
            results.checks.noRepeatedChars = maxRepeated <= 2;
            results.details.push({
                rule: 'No character repeated more than 2 times',
                passed: results.checks.noRepeatedChars,
                message: results.checks.noRepeatedChars ? 'No excessive repetition' : `Character repeated ${maxRepeated} times`
            });

            // Overall compliance
            results.isCompliant = Object.values(results.checks).every(check => check);

            return results;
        }

        // Check single password
        function checkSinglePassword() {
            const password = document.getElementById('singlePassword').value.trim();
            if (!password) {
                showCustomAlert('Please enter a password to test.');
                return;
            }

            const result = checkPasswordCompliance(password);
            displaySingleResult(password, result);
        }

        // Check batch passwords
        function checkBatchPasswords() {
            const input = document.getElementById('batchPasswords').value.trim();
            if (!input) {
                showCustomAlert('Please enter a JSON array of passwords.');
                return;
            }

            try {
                const passwords = JSON.parse(input);
                if (!Array.isArray(passwords)) {
                    throw new Error('Input must be an array');
                }

                const results = passwords.map(password => {
                    if (typeof password !== 'string') {
                        throw new Error('All array elements must be strings');
                    }
                    return checkPasswordCompliance(password);
                });

                displayBatchResults(passwords, results);
            } catch (error) {
                showCustomAlert('Invalid JSON format. Please enter a valid array of strings.');
            }
        }

        // Display single password result
        function displaySingleResult(password, result) {
            const container = document.getElementById('resultsContainer');
            const complianceColor = result.isCompliant ? 'text-green-400' : 'text-red-400';
            const complianceBg = result.isCompliant ? 'bg-green-500/20' : 'bg-red-500/20';

            container.innerHTML = `
                <div class="result-card ${complianceBg} rounded-xl p-6 border border-white/20">
                    <div class="flex items-center justify-between mb-4">
                        <h4 class="text-lg font-semibold">Password: "${password}"</h4>
                        <div class="flex items-center space-x-2">
                            <span class="text-2xl">${complianceIcon}</span>
                            <span class="font-semibold ${complianceColor}">
                                ${result.isCompliant ? 'COMPLIANT' : 'NON-COMPLIANT'}
                            </span>
                        </div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-3">
                        ${result.details.map(detail => `
                                    <div class="font-medium">${detail.rule}</div>
                                    <div class="text-sm text-gray-300">${detail.message}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            showResults();
        }

        // Display batch results
        function displayBatchResults(passwords, results) {
            const container = document.getElementById('resultsContainer');
            const complianceArray = results.map(r => r.isCompliant);
            
            container.innerHTML = `
                <div class="mb-6">
                    <h4 class="text-xl font-semibold mb-4">Compliance Summary</h4>
                    <div class="bg-gray-800/50 rounded-lg p-4 mb-4">
                        <div class="text-sm text-gray-300 mb-2">Boolean Result Array:</div>
                        <div class="font-mono text-lg bg-black/30 p-3 rounded border">
                            [${complianceArray.join(', ')}]
                        </div>
                    </div>
                    <div class="grid md:grid-cols-3 gap-4 text-center">
                        <div class="bg-green-500/20 rounded-lg p-4">
                            <div class="text-2xl font-bold text-green-400">${complianceArray.filter(Boolean).length}</div>
                            <div class="text-sm text-gray-300">Compliant</div>
                        </div>
                        <div class="bg-red-500/20 rounded-lg p-4">
                            <div class="text-2xl font-bold text-red-400">${complianceArray.filter(c => !c).length}</div>
                            <div class="text-sm text-gray-300">Non-Compliant</div>
                        </div>
                        <div class="bg-blue-500/20 rounded-lg p-4">
                            <div class="text-2xl font-bold text-blue-400">${passwords.length}</div>
                            <div class="text-sm text-gray-300">Total Tested</div>
                        </div>
                    </div>
                </div>
                
                <div class="space-y-4">
                    <h4 class="text-xl font-semibold">Detailed Results</h4>
                    ${passwords.map((password, index) => {
                        const result = results[index];
                        const complianceIcon = result.isCompliant ? '✅' : '❌';
                        const complianceColor = result.isCompliant ? 'text-green-400' : 'text-red-400';
                        const complianceBg = result.isCompliant ? 'bg-green-500/20' : 'bg-red-500/20';
                        
                        return `
                            <div class="result-card ${complianceBg} rounded-xl p-4 border border-white/20">
                                <div class="flex items-center justify-between mb-3">
                                    <h5 class="font-semibold">Password ${index + 1}: "${password}"</h5>
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xl">${complianceIcon}</span>
                                        <span class="font-medium ${complianceColor}">
                                            ${result.isCompliant ? 'PASS' : 'FAIL'}
                                        </span>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm">
                                    ${result.details.map(detail => `
                                        <div class="flex items-center space-x-2">
                                            <span class="truncate">${detail.rule}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            showResults();
        }

        // Show results section with animation
        function showResults() {
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.classList.remove('hidden');
            
            // Trigger animation
            setTimeout(() => {
                document.querySelectorAll('.result-card').forEach(card => {
                    card.classList.add('show');
                });
            }, 100);

            // Scroll to results
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Load example data
        function loadExample() {
            const exampleData = '["AAbbccdd11228", "12345678", "ABcd@2Fgh1J12", "aaaBBB1111!"]';
            document.getElementById('batchPasswords').value = exampleData;
        }

        // Custom alert function (since alert() is not supported)
        function showCustomAlert(message) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg max-w-md w-full p-6">
                    <div class="flex items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Notice</h3>
                    </div>
                    <p class="text-gray-700 dark:text-gray-300 mb-6">${message}</p>
                    <div class="flex justify-end">
                        <button class="px-4 py-2 bg-primary text-white hover:bg-primary/80 rounded transition-colors" onclick="this.closest('.fixed').remove()">
                            OK
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Add enter key support for single password input
        document.getElementById('singlePassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkSinglePassword();
            }
        });
    </script>
</body>

</html>
